# Blackjack Party: app + MySQL + Adminer (web DB manager).
# Configure everything in .env (copy .env.example), then: docker compose up -d --build

services:
    app:
        build: .
        image: blackjack-party:latest
        restart: unless-stopped
        depends_on:
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
            JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
            ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
            STARTING_BALANCE: ${STARTING_BALANCE:-1000}
            REFILL_COOLDOWN_HOURS: ${REFILL_COOLDOWN_HOURS:-24}
            COOKIE_SECURE: ${COOKIE_SECURE:-false}
            FIRST_BET_SECONDS: ${FIRST_BET_SECONDS:-10}
            BETTING_SECONDS: ${BETTING_SECONDS:-45}
            INSURANCE_SECONDS: ${INSURANCE_SECONDS:-10}
            TURN_SECONDS: ${TURN_SECONDS:-20}
            DEALER_HITS_SOFT_17: ${DEALER_HITS_SOFT_17:-false}
            DECKS: ${DECKS:-6}
        ports:
            - '${APP_PORT:-3000}:3000'

    db:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-blackjack}
            MYSQL_USER: ${MYSQL_USER:-blackjack}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
        volumes:
            - db-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}']
            interval: 5s
            timeout: 5s
            retries: 30

    adminer:
        image: adminer:6
        restart: unless-stopped
        depends_on:
            - db
        # The image listens on IPv6 only by default; most Docker networks are IPv4.
        command: ['php', '-S', '0.0.0.0:8080', '-t', '/var/www/html']
        environment:
            ADMINER_DEFAULT_SERVER: db
            ADMINER_DESIGN: pepa-linha
        # Bound to localhost by default; set ADMINER_BIND=0.0.0.0 in .env to reach it from other machines.
        ports:
            - '${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8080}:8080'

volumes:
    db-data:
