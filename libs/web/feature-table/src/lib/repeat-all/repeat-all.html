@if (total() > 0) {
	<button
		type="button"
		class="btn btn-accent chunky-sm repeat-button"
		[disabled]="!affordable()"
		[attr.title]="affordable() ? null : 'Not enough balance'"
		(click)="repeat.emit(bets())"
	>
		<bj-icon name="repeat" />
		<span class="repeat-label">Repeat all &amp; deal</span><span class="repeat-sep"> · </span
		><span>{{ dollars(total()) }}</span>
	</button>
}
