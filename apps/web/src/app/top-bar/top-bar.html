<header class="app-bar">
	<a routerLink="/lobby" class="brand" aria-label="Blackjack Party"
		><span aria-hidden="true">♠</span> <span class="brand-name">Blackjack Party</span></a
	>

	@if (pageTitle.current(); as page) {
		<div class="page-nav">
			<a [routerLink]="page.backLink" class="back" aria-label="Back to lobby"
				><bj-icon name="back"
			/></a>
			<div class="page-title">
				<span class="page-name">{{ page.title }}</span>
				<span class="page-sub">{{ page.subtitle }}</span>
			</div>
		</div>
	}

	<nav class="main-nav" aria-label="Main">
		<a routerLink="/lobby" routerLinkActive="active" class="nav-link">Lobby</a>
		@if (auth.isAdmin()) {
			<a
				routerLink="/admin"
				routerLinkActive="active"
				[routerLinkActiveOptions]="{ exact: true }"
				class="nav-link"
				>Tables</a
			>
			<a routerLink="/admin/players" routerLinkActive="active" class="nav-link">Players</a>
		}
	</nav>

	<div class="account">
		<bj-refill-button />
		<bj-balance-display class="bar-item" [amount]="auth.balance()" />
		<span class="separator" aria-hidden="true"></span>
		<span class="user" [attr.title]="auth.user()?.username">
			<span class="avatar-initial" aria-hidden="true">{{ initial() }}</span>
			<span class="username">{{ auth.user()?.username }}</span>
		</span>
		<button type="button" class="logout bar-item" aria-label="Log out" (click)="logout()">
			<bj-icon name="logout" />
			<span class="logout-label">Log out</span>
		</button>
	</div>
</header>
