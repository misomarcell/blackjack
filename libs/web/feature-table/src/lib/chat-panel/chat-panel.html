<bj-floating-panel heading="Table chat" icon="chat" [badge]="unread()" [(open)]="open">
	<ol #log class="lines" aria-live="polite" aria-label="Messages">
		@for (message of messages(); track message.id) {
			<li>
				<time class="opacity-60" [attr.datetime]="message.sentAt">{{ time(message.sentAt) }}</time>
				<strong class="text-log-player">{{ message.username }}</strong>
				<span class="font-semibold">{{ message.text }}</span>
			</li>
		} @empty {
			<li class="opacity-60">Say hi to the table!</li>
		}
	</ol>
	<!-- The label sits outside the join, so the input is its first item and gets the rounded left edge. -->
	<label for="chat-input" class="sr-only">Message</label>
	<form [formRoot]="chatForm" class="join w-full">
		<input
			id="chat-input"
			class="input input-sm join-item w-full"
			type="text"
			autocomplete="off"
			enterkeyhint="send"
			placeholder="Type a message…"
			[formField]="chatForm.text"
		/>
		<button type="submit" class="btn btn-sm btn-primary join-item">Send</button>
	</form>
</bj-floating-panel>
