<div class="chips" role="group" aria-label="Add chips">
	@for (value of chips; track value) {
		<button
			type="button"
			class="chip"
			[class]="'chip-' + value"
			[disabled]="!canAdd(value)"
			[attr.aria-label]="'Bet ' + dollars(value)"
			(click)="chip.emit(value)"
		>
			{{ value }}
		</button>
	}
	<!-- One chip-shaped slot: clear the chips that are down, or put last round's bet back. -->
	@if (bet() > 0) {
		<button
			type="button"
			class="chip chip-tool"
			aria-label="Clear bet"
			title="Clear bet"
			(click)="clear.emit()"
		>
			✕
		</button>
	} @else if (showRepeat()) {
		<button
			type="button"
			class="chip chip-tool"
			[disabled]="!canRepeat()"
			[attr.aria-label]="'Repeat last bet of ' + dollars(lastBet())"
			[attr.title]="'Repeat ' + dollars(lastBet())"
			(click)="repeat()"
		>
			↻
		</button>
	} @else {
		<span class="chip chip-tool chip-placeholder" aria-hidden="true"></span>
	}
</div>
<button
	type="button"
	class="btn btn-primary chunky-sm place"
	[disabled]="bet() < minBet()"
	(click)="ready.emit()"
>
	Place bet
</button>
