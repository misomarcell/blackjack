<div class="chips" role="group" aria-label="Add chips">
	@for (value of chips; track value) {
		<button
			type="button"
			class="chip"
			[class]="'chip-' + value"
			[disabled]="!canAdd(value)"
			[attr.aria-label]="'Bet ' + dollars(value)"
			(click)="chip.emit(value)"
		>
			{{ value }}
		</button>
	}
</div>
<div class="bet-row">
	<div class="bet-amount">
		<span class="sr-only">Your bet</span>
		<output aria-live="polite">{{ dollars(bet()) }}</output>
		@if (bet() > 0) {
			<button type="button" class="clear" aria-label="Clear bet" (click)="clear.emit()">✕</button>
		}
	</div>
	<button
		type="button"
		class="btn btn-primary chunky-sm place"
		[disabled]="bet() < minBet()"
		[attr.aria-describedby]="bet() < minBet() ? 'min-bet-hint' : null"
		(click)="ready.emit()"
	>
		Place bet
	</button>
</div>
@if (bet() < minBet()) {
	<p id="min-bet-hint" class="text-xs">Minimum bet {{ dollars(minBet()) }}</p>
}
