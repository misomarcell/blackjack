<div class="table-title">
	<a routerLink="/lobby" class="btn btn-sm btn-circle btn-neutral" aria-label="Back to lobby">←</a>
	<div class="leading-tight">
		<h1 class="text-lg md:text-2xl">{{ table().name }}</h1>
		<p class="text-xs md:text-sm">{{ limits() }}</p>
	</div>
</div>

<p class="banner" aria-live="polite">{{ message() }}</p>

<div class="actions">
	<bj-countdown [timer]="table().timer" [receivedAt]="receivedAt()" />
	<button
		type="button"
		class="btn btn-sm btn-circle chunky-sm audio-toggle"
		[class.off]="!audio.soundOn()"
		[attr.aria-pressed]="audio.soundOn()"
		aria-label="Sound effects"
		[attr.title]="audio.soundOn() ? 'Sound effects on' : 'Sound effects off'"
		(click)="audio.soundOn.set(!audio.soundOn())"
	>
		{{ audio.soundOn() ? '🔊' : '🔇' }}
	</button>
	<button
		type="button"
		class="btn btn-sm btn-circle chunky-sm audio-toggle"
		[class.off]="!audio.musicOn()"
		[attr.aria-pressed]="audio.musicOn()"
		aria-label="Music"
		[attr.title]="audio.musicOn() ? 'Music on' : 'Music off'"
		(click)="audio.musicOn.set(!audio.musicOn())"
	>
		🎵
	</button>
	<button type="button" class="btn btn-sm btn-secondary chunky-sm" (click)="share()">
		{{ copied() ? 'Copied!' : 'Share link' }}
	</button>
	@if (seated()) {
		<button type="button" class="btn btn-sm chunky-sm" (click)="leaveSeat.emit()">Stand up</button>
	}
</div>
