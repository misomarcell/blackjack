<div class="moves" role="group" aria-label="Your move">
	@for (move of moves(); track move.action) {
		<button
			type="button"
			class="move"
			[class]="'move-' + move.action"
			[disabled]="!move.enabled"
			[attr.aria-keyshortcuts]="move.key"
			(click)="act.emit(move.action)"
		>
			<span>{{ move.label }}</span>
			<kbd class="key">{{ move.key }}</kbd>
		</button>
	}
</div>
