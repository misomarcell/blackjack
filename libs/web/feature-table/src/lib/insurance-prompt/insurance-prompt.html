<p class="font-display text-lg">
	@if (seatLabel()) {
		{{ seatLabel() }}:
	}
	Insure your hand for {{ dollars(cost()) }}?
</p>
<div class="choices">
	<button
		type="button"
		class="btn btn-accent chunky-sm choice"
		[disabled]="!affordable()"
		(click)="decide.emit(true)"
	>
		Yes, insure
	</button>
	<button type="button" class="btn chunky-sm choice" (click)="decide.emit(false)">No thanks</button>
</div>
