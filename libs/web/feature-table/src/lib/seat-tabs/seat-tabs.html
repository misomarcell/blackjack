<div class="join" role="group" aria-label="Bet on seat">
	@for (seat of seats(); track seat.index) {
		<button
			type="button"
			class="btn btn-sm join-item seat-tab"
			[class.btn-secondary]="seat.index === selected()"
			[attr.aria-pressed]="seat.index === selected()"
			(click)="picked.emit(seat.index)"
		>
			Seat {{ seat.index + 1 }}
			<span class="seat-tab-bet">{{ dollars(seat.bet) }}</span>
		</button>
	}
</div>
